<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
  :root{--ink:#110c06;--bone:#e8dcc6;--bone-dim:#a99a83;--brass:#d07a3a}
  body{margin:0;background:var(--ink);color:var(--bone);display:grid;place-content:center;
       min-height:100vh;text-align:center;padding:24px;
       font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h1{font-family:"Bitter",Georgia,serif;font-weight:600;line-height:1.12;margin:0 0 .4em}
  .eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.22em;
           text-transform:uppercase;color:var(--brass);margin:0 0 1rem}
  .dim{color:var(--bone-dim)}
  .btn{display:inline-block;padding:13px 26px;font-size:.92rem;font-weight:600;letter-spacing:.04em;
       border-radius:2px;border:1px solid var(--brass);background:var(--brass);color:var(--ink);
       text-decoration:none}
</style>
</head>
<body>
  <div>
    <p class="eyebrow">404</p>
    <h1 style="font-size:clamp(2rem,6vw,3.4rem)">This road doesn't go anywhere.</h1>
    <p class="dim">The page you're looking for isn't here.</p>
    <p style="margin-top:28px"><a class="btn btn--solid" href="/">Back to the start</a></p>
  </div>
</body>
</html>
